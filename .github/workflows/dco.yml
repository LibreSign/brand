name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify commit sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          failed=0

          for commit in $(git rev-list --reverse "$BASE_SHA..$HEAD_SHA"); do
            author="$(git show -s --format='%an <%ae>' "$commit")"
            expected="Signed-off-by: $author"

            if ! git show -s --format='%B' "$commit" | grep -Fqx "$expected"; then
              echo "::error::Commit $commit is missing the DCO trailer: $expected"
              failed=1
            fi
          done

          exit "$failed"
