name: Build brand manual

on:
  push:
    paths:
      - "manual/**"
      - "source/artwork/**"
      - "source/fonts/**"
      - "scripts/build_assets.py"
      - ".github/workflows/manual.yml"
  pull_request:
    paths:
      - "manual/**"
      - "source/artwork/**"
      - "source/fonts/**"
      - "scripts/build_assets.py"
      - ".github/workflows/manual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: typst-community/setup-typst@40d32bb6ccb235bd7f5164cb47cfd40a5ea3a314 # v5.2.0
        with:
          typst-version: 0.15.1
      - name: Install Typstyle
        env:
          TYPSTYLE_VERSION: "0.15.1"
          TYPSTYLE_SHA256: "213c11bc2c64f7237c382b4bb1d06991530ed9d44d3a05204ca3c19615d55b99"
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/typstyle-rs/typstyle/releases/download/v${TYPSTYLE_VERSION}/typstyle-x86_64-unknown-linux-gnu" \
            --output /tmp/typstyle
          echo "${TYPSTYLE_SHA256}  /tmp/typstyle" | sha256sum --check -
          chmod +x /tmp/typstyle
          sudo install /tmp/typstyle /usr/local/bin/typstyle
      - name: Check Typst formatting
        run: typstyle --diff --line-width 120 manual
      - name: Install asset toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape
      - name: Generate brand assets
        run: python scripts/build_assets.py --output build/assets
      - name: Build accessible PDF
        run: |
          typst compile --root . --font-path source/fonts --pdf-standard ua-1 manual/main.typ build/brand-manual.pdf
      - name: Validate PDF/UA-1 with veraPDF
        run: |
          docker run --rm \
            -v "$PWD/build:/data:ro" \
            verapdf/cli:latest \
            --flavour ua1 --format text /data/brand-manual.pdf
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brand-manual
          path: build/brand-manual.pdf
