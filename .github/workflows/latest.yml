name: Publish latest brand build

on:
  push:
    branches: [main]
    paths:
      - "manual/**"
      - "source/artwork/**"
      - "source/fonts/**"
      - "scripts/build_assets.py"
      - ".github/workflows/latest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-brand-build
  cancel-in-progress: true

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - name: Install asset toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape
      - name: Build latest artifacts
        run: |
          python scripts/build_assets.py --output build/assets
          typst compile --root . --font-path source/fonts --pdf-standard ua-1 manual/main.typ build/libresign-brand-manual.pdf
          cp build/assets/libresign-logo.svg build/libresign-logo.svg
          cp build/assets/libresign-logo.pdf build/libresign-logo.pdf
          cp build/assets/libresign-logo.png build/libresign-logo.png
          cp build/assets/libresign-logo-reversed.svg build/libresign-logo-reversed.svg
          sha256sum build/libresign-brand-manual.pdf build/libresign-logo* > build/SHA256SUMS
      - name: Move latest tag to this build
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force
      - name: Publish stable latest URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --prerelease --title "Latest development build" --notes "Continuously updated development build from the main branch. This is not a versioned release."
          fi
          gh release edit latest --title "Latest development build" --notes "Continuously updated development build from the main branch. This is not a versioned release." --prerelease
          gh release upload latest             build/libresign-brand-manual.pdf             build/libresign-logo.svg             build/libresign-logo.pdf             build/libresign-logo.png             build/libresign-logo-reversed.svg             build/SHA256SUMS             --clobber
